# 豆谱生产部署编排（ADR-0005）：app + postgres + caddy + 每日备份
# 用法：cp .env.example .env，填写已通过 release 门禁的 APP_IMAGE 后执行 deploy.sh
#
# 显式固定 project name（admin-round-3 11）：默认名取自目录名，若在 /opt/doupu 以外的目录部署，
# 默认网络会变成 <dirname>_default，而「迟迟」等邻居服务是按 doupu_default 接入的 —— 会直接断联。
name: doupu
services:
  app:
    # 生产只消费 release workflow 推送的稳定 tag/digest；禁止服务器从任意源码本地重建。
    image: ${APP_IMAGE:?请在 .env 中设置通过门禁的 GHCR APP_IMAGE}
    restart: unless-stopped
    # 显式注入变量（安全自查 M5）：不整份 env_file，避免 COS 备份凭据等无关密钥进入 app 容器
    environment:
      APP_URL: ${APP_URL:?请在 .env 中设置 APP_URL}
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      # 邮件（SES 模板模式 / SMTP 二选一；生产环境必须完整配置其中一套）
      SES_SECRET_ID: ${SES_SECRET_ID:-}
      SES_SECRET_KEY: ${SES_SECRET_KEY:-}
      SES_REGION: ${SES_REGION:-}
      SES_FROM: ${SES_FROM:-}
      SES_VERIFY_TEMPLATE_ID: ${SES_VERIFY_TEMPLATE_ID:-}
      SES_RESET_TEMPLATE_ID: ${SES_RESET_TEMPLATE_ID:-}
      SES_ALERT_TEMPLATE_ID: ${SES_ALERT_TEMPLATE_ID:-}
      MAIL_DAILY_SEND_LIMIT: ${MAIL_DAILY_SEND_LIMIT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 备份告警（内部接口鉴权 + 管理员收件邮箱）
      BACKUP_ALERT_TOKEN: ${BACKUP_ALERT_TOKEN:?请在 .env 中设置 BACKUP_ALERT_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?请在 .env 中设置 ADMIN_EMAIL}
      # 站点配置（全部可选，默认值见 .env.example 注释）
      GEN_DEFAULT_WIDTH: ${GEN_DEFAULT_WIDTH:-}
      GEN_DEFAULT_COLORS: ${GEN_DEFAULT_COLORS:-}
      PNG_CELL_PX: ${PNG_CELL_PX:-}
      PNG_CROP_TO_CONTENT: ${PNG_CROP_TO_CONTENT:-}
      PNG_INCLUDE_LEGEND: ${PNG_INCLUDE_LEGEND:-}
      PDF_CELL_MM: ${PDF_CELL_MM:-}
      PDF_MARGIN_MM: ${PDF_MARGIN_MM:-}
      PDF_HEADER_MM: ${PDF_HEADER_MM:-}
      PDF_PAGE_COLS: ${PDF_PAGE_COLS:-}
      PDF_PAGE_ROWS: ${PDF_PAGE_ROWS:-}
      RATE_LOGIN: ${RATE_LOGIN:-}
      RATE_REGISTER: ${RATE_REGISTER:-}
      RATE_TOKEN: ${RATE_TOKEN:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-}
      RATE_SYNC_WRITE: ${RATE_SYNC_WRITE:-}
      RATE_BACKUP_ALERT: ${RATE_BACKUP_ALERT:-}
      RATE_ANALYTICS: ${RATE_ANALYTICS:-}
      ANALYTICS_IP_HMAC_KEY: ${ANALYTICS_IP_HMAC_KEY:?请设置独立的分析限流 HMAC 密钥}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-}
      # 作品原图私有桶（D49，生产必填）：默认与备份共用 COS_BUCKET（原图在 originals/ 前缀下），
      # 需要单独分桶 / 子账号时才填 COS_ORIGINALS_*；app 只收到原图侧这一组变量。
      # COS_BUCKET 缺失由 backup 服务的 :? 校验与 app 启动校验共同拦截。
      COS_ORIGINALS_BUCKET: ${COS_ORIGINALS_BUCKET:-${COS_BUCKET:-}}
      COS_ORIGINALS_SECRET_ID: ${COS_ORIGINALS_SECRET_ID:-${COS_SECRET_ID:-}}
      COS_ORIGINALS_SECRET_KEY: ${COS_ORIGINALS_SECRET_KEY:-${COS_SECRET_KEY:-}}
      COS_ORIGINALS_REGION: ${COS_ORIGINALS_REGION:-${COS_REGION:-}}
      # 评论内容安全（D50）：凭证默认沿用 COS 子账号密钥（需在 CAM 给它加 tms:TextModeration），
      # TMS_* 可单独指定；只要填了 TMS_BIZ_TYPE 并授权即可启用，缺凭证时评论全部进入人工待审。
      TMS_ENABLED: ${TMS_ENABLED:-}
      TMS_SECRET_ID: ${TMS_SECRET_ID:-${COS_SECRET_ID:-}}
      TMS_SECRET_KEY: ${TMS_SECRET_KEY:-${COS_SECRET_KEY:-}}
      TMS_REGION: ${TMS_REGION:-}
      TMS_BIZ_TYPE: ${TMS_BIZ_TYPE:-}
      TMS_DAILY_BUDGET: ${TMS_DAILY_BUDGET:-}
      TMS_CACHE_HOURS: ${TMS_CACHE_HOURS:-}
      TMS_TIMEOUT_MS: ${TMS_TIMEOUT_MS:-}
      RATE_COMMENT_USER_HOUR: ${RATE_COMMENT_USER_HOUR:-}
      RATE_COMMENT_USER_DAY: ${RATE_COMMENT_USER_DAY:-}
      RATE_COMMENT_IP_HOUR: ${RATE_COMMENT_IP_HOUR:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # ---- 资源上限与最小权限（本票 11；单机小内存主机的兜底，全部可用 .env 覆盖）----
    # 容器日志轮转：json-file 默认无上限，长期运行会把系统盘写满（单机盘满 = 全站不可用）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 内存上限：默认 1g，给 standalone Node + argon2 原生模块留足；调参见 deploy/CHECKLIST.md。
    mem_limit: ${APP_MEM_LIMIT:-1g}
    # CPU 上限：默认 1.5 核（2 核小机上给 postgres/Caddy 留出余量）。
    cpus: ${APP_CPUS:-1.5}
    # 进程/线程数上限：挡 fork 炸弹与失控的并发任务；默认值远高于正常峰值。
    pids_limit: 512
    # 丢弃全部 Linux capability：应用只需监听 >1024 端口、读写自己挂载的 tmpfs。
    cap_drop:
      - ALL
    # 禁止 setuid/setgid 提权（镜像里本就用非 root 的 nextjs 用户运行）。
    security_opt:
      - no-new-privileges:true
    # 只读根文件系统：被入侵的进程无法改写镜像内容（应用代码/依赖）。
    read_only: true
    # 只读根文件系统下仍需可写的位置（缺失会让 Next 在写缓存时报 EROFS）：
    # - /tmp：Node/Next 的 os.tmpdir() 临时文件；64m 足够本应用（无大文件落盘）。
    # - /app/.next/cache：Next 16 把 fetch/增量缓存写在 distDir 下的 cache 目录
    #   （node_modules/next/dist/server/lib/incremental-cache/file-system-cache.js 里
    #   解析为 <serverDistDir>/../cache/fetch-cache，即 /app/.next/cache/fetch-cache）。
    #   缓存是可丢数据，放 tmpfs 既满足写入又不会无限增长；128m 足够。
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doupu}
      POSTGRES_USER: ${POSTGRES_USER:-doupu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doupu} -d ${POSTGRES_DB:-doupu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ---- 资源上限与最小权限（本票 11）----
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 内存上限：默认 768m。注意 PostgreSQL 会按需吃 shared_buffers（默认 128MB）
    # 与排序/哈希的内存，上限过低只会让查询失败，不会让数据损坏；调参见 CHECKLIST。
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    # /dev/shm 默认仅 64MB：并行查询/大排序会报 "could not resize shared memory"，
    # 这里显式给 256MB（比调大 work_mem 更安全，不占用主内存上限）。
    shm_size: 256mb
    # 进程数上限：PostgreSQL 每连接一个后端进程，256 远高于本应用连接池上限（DB_POOL_MAX）。
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    # capability 白名单：不 drop ALL。postgres 官方镜像的 entrypoint 以 root 启动，
    # 需要 CHOWN/DAC_OVERRIDE/FOWNER 处理数据目录与 initdb 文件、SETUID/SETGID 切到
    # postgres 用户；多丢弃任何一项都会让容器起不来。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Caddyfile 的 {$SITE_DOMAIN} 占位符来源；仅注入这三项（与 backup 同风格的最小面）
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN}
      # 迟迟（chi）：同机第二个应用的站点域名与上游地址（见 Caddyfile 末尾的站点块）。
      # 迟迟是独立 compose 项目，通过 external network doupu_default 接入本网络，
      # 因此这里只需要域名与上游，不需要在本文件里声明 chi 服务。
      # CHI_UPSTREAM 有默认值：Caddyfile 里写的是 {$CHI_UPSTREAM}，不依赖 Caddy 自身的默认值语法。
      CHI_SITE_DOMAIN: ${CHI_SITE_DOMAIN:?请在 .env 中设置 CHI_SITE_DOMAIN}
      CHI_UPSTREAM: ${CHI_UPSTREAM:-chi:3200}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    # ---- 资源上限（本票 11）----
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Caddy 的访问日志会明显增加日志量（本票新增），轮转上限因此更重要。
    # 内存默认 256m：TLS 证书、连接与日志缓冲都远小于此；调参见 CHECKLIST。
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    pids_limit: ${CADDY_PIDS_LIMIT:-256}

  backup:
    build:
      context: ./deploy
      dockerfile: Dockerfile.backup
    image: doupu-backup:local
    # 连续失败三次后保持 exited(non-zero)，避免 backup/alert 双失败却显示容器正常。
    restart: on-failure:3
    # 只注入备份所需变量（安全审查）：不整份 env_file，避免 SMTP/数据库密钥面扩大
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-doupu}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-doupu}
      # 备份专用 COS 凭证（本票 11）：容器内仍叫 COS_SECRET_ID/COS_SECRET_KEY
      # （backup.sh 与 rclone 读的就是这两个名字），但 .env 里必须来自
      # BACKUP_COS_SECRET_ID/KEY —— 刻意不回退到 app 的 COS_*：备份只需要
      # doupu-backup/ 前缀的写权限，用应用密钥等于把原图桶的读写权也交给备份任务。
      # 未配置时取空值：备份脚本启动即失败并告警（不会静默写出无凭证的“成功”）。
      COS_SECRET_ID: ${BACKUP_COS_SECRET_ID:-}
      COS_SECRET_KEY: ${BACKUP_COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:?请在 .env 中设置 COS_BUCKET}
      COS_REGION: ${COS_REGION:?请在 .env 中设置 COS_REGION}
      # 失败告警：POST 到 app 容器内部告警端点（共享令牌鉴权）
      BACKUP_ALERT_TOKEN: ${BACKUP_ALERT_TOKEN:?请在 .env 中设置 BACKUP_ALERT_TOKEN}
      ALERT_ENDPOINT: ${ALERT_ENDPOINT:-http://app:3000/api/internal/backup-alert}
      APP_HEALTH_ENDPOINT: http://app:3000/
      BACKUP_STATUS_FILE: /tmp/backup-last-success
      BACKUP_MAX_AGE_SECONDS: "129600"
      # rclone 远程 doupucos（TencentCOS，签名由 rclone 处理）
      RCLONE_CONFIG_DOUPUCOS_TYPE: s3
      RCLONE_CONFIG_DOUPUCOS_PROVIDER: TencentCOS
      RCLONE_CONFIG_DOUPUCOS_ENV_AUTH: "true"
      RCLONE_CONFIG_DOUPUCOS_ACCESS_KEY_ID: ${BACKUP_COS_SECRET_ID:-}
      RCLONE_CONFIG_DOUPUCOS_SECRET_ACCESS_KEY: ${BACKUP_COS_SECRET_KEY:-}
      RCLONE_CONFIG_DOUPUCOS_ENDPOINT: https://cos.${COS_REGION:-ap-seoul}.myqcloud.com
    volumes:
      - ./deploy/scripts:/scripts:ro
    entrypoint: ["/scripts/backup-loop.sh"]
    healthcheck:
      test: ["CMD", "/scripts/backup-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    # ---- 资源上限（本票 11）----
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 备份容器只在运行 pg_dump 时吃内存，默认 512m（含 gzip 压缩缓冲）足够；
    # 大库需要调大时改 .env 的 BACKUP_MEM_LIMIT（见 deploy/CHECKLIST.md）。
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    pids_limit: ${BACKUP_PIDS_LIMIT:-256}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
