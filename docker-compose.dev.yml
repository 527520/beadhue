# 开发/测试数据库（ticket 13；生产 compose 属 T21）
services:
  postgres:
    image: postgres:16-alpine
    container_name: beadhue-postgres
    environment:
      POSTGRES_DB: beadhue
      POSTGRES_USER: beadhue
      POSTGRES_PASSWORD: beadhue
    ports:
      - '5432:5432'
    volumes:
      - beadhue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beadhue -d beadhue']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beadhue-pgdata:
